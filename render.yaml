# Blueprint de Render para la demo: sitio estático, sin variables.
services:
  - type: web
    name: dual-safe-demo
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
